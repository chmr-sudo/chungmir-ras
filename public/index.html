<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>청미르초 폰프리 RAS</title>
<link rel="icon" type="image/svg+xml" href="mascot.svg">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --r:#3b7755; --r-soft:#e8f1ec;
  --a:#c2742d; --a-soft:#f7ecdd;
  --s:#3d6e98; --s-soft:#e7eef5;
  --sky:#3aa7ef; --sky-soft:#e3f2fd;
  --ink:#38322c; --sub:#8a8178;
  --line:#efe9e1; --card:#ffffff;
  --bg1:#fff7ec; --bg2:#eaf6ff;
  --ok:#22a06b; --warn:#e8604c;
  --brown:#6b5647;
  --radius:20px;
  --shadow:0 8px 24px rgba(120,100,70,.10);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Jua","Apple SD Gothic Neo",var(--font);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
}
.app{
  width:100%; max-width:460px; min-height:100vh; background:#fffdf9;
  position:relative; box-shadow:0 0 50px rgba(110,90,60,.12); overflow:hidden;
  display:flex; flex-direction:column;
}
/* role selector */
.preview{
  background:#fffdf9; border-bottom:1px solid var(--line); color:var(--sub);
  font-size:12px; display:flex; align-items:center;
  gap:8px; padding:8px 12px; flex-wrap:wrap;
}
.preview b{font-weight:700;opacity:.7;font-size:11px;color:var(--sub)}
.preview .seg{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.preview button{
  border:1px solid var(--line); background:#fff; color:var(--sub); font-size:12px; padding:5px 11px;
  border-radius:999px; cursor:pointer; font-family:var(--font); font-weight:600;
}
.preview button.on{background:var(--sky);color:#fff;border-color:var(--sky);font-weight:700;box-shadow:0 2px 8px rgba(58,167,239,.3)}
/* topbar */
.topbar{
  display:flex; align-items:center; gap:10px; padding:12px 16px 10px;
  position:sticky; top:0; background:rgba(255,253,249,.92); backdrop-filter:blur(6px);
  z-index:20; border-bottom:1px solid var(--line);
}
.brand{font-family:var(--display); font-size:20px; display:flex; align-items:center; gap:7px; letter-spacing:.3px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--sky),#6bd0ff); color:#fff; font-size:17px;
  box-shadow:0 4px 10px rgba(58,167,239,.4)
}
.brand small{display:block;font-family:var(--font);font-size:10px;color:var(--sub);font-weight:400;margin-top:-2px}
.topbar .rolechip{margin-left:auto;font-size:11px;background:var(--sky-soft);color:#1b73b3;padding:4px 10px;border-radius:999px;font-weight:700}
.phoneoff{font-size:11px;color:var(--brown);background:#f3ece2;padding:4px 9px;border-radius:999px;font-weight:700}
/* screen */
.screen{flex:1; min-height:0; overflow-y:auto; padding:14px 16px 96px; -webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
h2.sec{font-family:var(--display);font-size:18px;margin:18px 2px 10px;display:flex;align-items:center;gap:7px}
h2.sec:first-child{margin-top:4px}
.muted{color:var(--sub);font-size:13px;line-height:1.55}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:13px}
.hero{
  border:0;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#ff9a56,#ff7e8a 55%,#a06be0);
}
.hero h1{font-family:var(--display);font-size:22px;margin:0 0 6px;line-height:1.3}
.hero p{margin:0;font-size:13px;opacity:.95;line-height:1.55}
.hero .big{font-family:var(--display);font-size:15px;background:rgba(255,255,255,.22);display:inline-block;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.hero .deco{position:absolute;right:-10px;bottom:-14px;font-size:92px;opacity:.18;transform:rotate(-8deg)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--sky),#59c0ff);color:#fff;box-shadow:0 6px 14px rgba(58,167,239,.35)}
.btn.g{background:#f3ece2;color:var(--brown)}
.btn.r{background:var(--r);color:#fff}
.btn.a{background:var(--a);color:#fff}
.btn.s{background:var(--s);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:11px}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:9px}
.row .btn{flex:1}
/* participation track */
.track{margin:2px 0 4px}
.track .lane{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.track .lab{width:46px;font-size:13px;font-weight:700;color:var(--brown)}
.track .bar{flex:1;height:14px;background:#f1ebe2;border-radius:999px;overflow:hidden;position:relative}
.track .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ffd23f,var(--s))}
.track .pct{width:46px;text-align:right;font-size:12px;color:var(--sub);font-weight:700}
/* zone cards */
.zone{display:flex;align-items:center;gap:13px;padding:15px;border-radius:18px;margin-bottom:11px;cursor:pointer;border:1.5px solid transparent;transition:transform .08s}
.zone:active{transform:scale(.98)}
.zone .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none}
.zone .t{font-family:var(--display);font-size:17px}
.zone .d{font-size:12px;color:var(--sub);margin-top:2px}
.zone.r{background:var(--r-soft);border-color:#c7ecd6}.zone.r .ic{background:var(--r);color:#fff}.zone.r .t{color:#1c7a50}
.zone.a{background:var(--a-soft);border-color:#e3d4f7}.zone.a .ic{background:var(--a);color:#fff}.zone.a .t{color:#6b3fa8}
.zone.s{background:var(--s-soft);border-color:#f8ddc0}.zone.s .ic{background:var(--s);color:#fff}.zone.s .t{color:#b8651a}
.chev{margin-left:auto;color:var(--sub);font-size:20px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:1;border-radius:11px;background:#f6f1e9;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--sub);position:relative;border:1.5px solid transparent;cursor:pointer}
.cal .d .n{font-weight:700;color:var(--ink);font-size:13px}
.cal .d.done{background:var(--r-soft);border-color:var(--r)}
.cal .d.done .n{color:#1c7a50}
.cal .d.done::after{content:"✓";position:absolute;top:2px;right:5px;color:var(--r);font-weight:900;font-size:11px}
.cal .d.sp{box-shadow:inset 0 0 0 2px #ffd23f}
.cal .d.future{opacity:.45}
.cal .d.today{border-color:var(--sky)}
.cdow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cdow span{text-align:center;font-size:11px;color:var(--sub)}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.post{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.post .ph{height:92px;display:grid;place-items:center;font-size:40px}
.post .meta{padding:9px 10px}
.post .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-bottom:4px}
.post .who{font-size:11px;color:var(--sub)}
.post .txt{font-size:12px;margin:3px 0 7px;line-height:1.4}
.react{display:flex;gap:6px}
.react button{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11px;padding:3px 8px;cursor:pointer;display:flex;gap:3px;align-items:center;font-family:var(--font)}
.react button.on{background:#fff4f4;border-color:#ffc9c9}
.tag.r{background:var(--r-soft);color:#1c7a50}.tag.a{background:var(--a-soft);color:#6b3fa8}.tag.s{background:var(--s-soft);color:#b8651a}
/* filter chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px}
.chips::-webkit-scrollbar{height:0}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--sub);font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.tile .v{font-family:var(--display);font-size:24px}
.tile .k{font-size:11px;color:var(--sub);margin-top:1px}
.tile.accent{background:linear-gradient(135deg,#fff5e6,#ffe9ef)}
/* bars chart */
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars .b .bar{width:70%;background:linear-gradient(180deg,#6bd0ff,var(--sky));border-radius:5px 5px 0 0;min-height:3px}
.bars .b .bl{font-size:9px;color:var(--sub)}
/* ras split */
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:8px 0}
.split i{display:block}
.legend{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
/* table */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
table.tb th{color:var(--sub);font-size:11px;font-weight:700}
table.tb td:first-child,table.tb th:first-child{text-align:left}
.rank{font-family:var(--display);color:var(--s)}
/* list rows */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .av{width:38px;height:38px;border-radius:11px;background:var(--sky-soft);display:grid;place-items:center;font-size:18px;flex:none}
.lrow .nm{font-weight:700;font-size:14px}
.lrow .sb{font-size:12px;color:var(--sub)}
.lrow .rt{margin-left:auto;display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;font-size:12px;cursor:pointer;font-family:var(--font)}
.iconbtn.danger{color:var(--warn);border-color:#f6d4cf}
/* form */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:var(--font);background:#fff}
.field textarea{resize:vertical;min-height:70px}
.hint{font-size:11px;color:var(--sub);margin-top:4px}
.seg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg3 .opt{border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;font-weight:700;font-size:13px}
.seg3 .opt .e{font-size:26px;display:block;margin-bottom:3px}
.seg3 .opt.r.on{border-color:var(--r);background:var(--r-soft)}
.seg3 .opt.a.on{border-color:var(--a);background:var(--a-soft)}
.seg3 .opt.s.on{border-color:var(--s);background:var(--s-soft)}
/* modal / sheet */
.sheet-bg{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(40,30,20,.5);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fffdf9;width:100%;border-radius:24px 24px 0 0;padding:18px 18px 24px;max-height:90%;overflow-y:auto;animation:up .25s}
.sheet h3{font-family:var(--display);font-size:19px;margin:2px 0 12px;display:flex;align-items:center;gap:7px}
.sheet .x{position:absolute;top:-46px;right:4px;background:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* toast */
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#2d2620;color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:pop .3s;max-width:88%;text-align:center}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* celebrate */
.celebrate{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:70;display:grid;place-items:center;background:rgba(255,253,249,.96);text-align:center;padding:30px;animation:fade .2s}
.celebrate .big{font-size:80px;animation:boing .6s}
.celebrate h3{font-family:var(--display);font-size:24px;margin:10px 0 6px}
@keyframes boing{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* logo & mascot */
.brand img.mark{background:#fff;border-radius:50%;padding:0;object-fit:contain;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.hero-mascot{position:absolute;right:6px;bottom:-10px;width:104px;filter:drop-shadow(0 7px 10px rgba(0,0,0,.20));z-index:1}
.schoolmark{display:flex;align-items:center;gap:11px;justify-content:center;padding:14px 10px 4px;color:var(--sub)}
.schoolmark img{width:50px;height:50px;flex:none}
.schoolmark b{font-family:var(--display);font-size:16px;color:var(--brown);display:block;line-height:1.2}
.schoolmark small{font-size:9px;letter-spacing:.5px}
.mascot-badge{width:120px;height:120px;margin:0 auto 6px;display:block}
/* bottom nav */
.tabbar{position:sticky;bottom:0;display:flex;background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:20}
.tabbar button{flex:1;border:0;background:none;padding:9px 2px 10px;cursor:pointer;color:var(--sub);font-family:var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.tabbar button .i{font-size:20px;line-height:1}
.tabbar button.on{color:var(--sky)}
.tabbar button.on .i{transform:translateY(-1px)}
/* misc */
.callout{background:var(--sky-soft);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;color:#1b5e8a}
.callout.warn{background:#fdeeea;color:#a2442f}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f3ece2;color:var(--brown)}
.divider{height:1px;background:var(--line);margin:14px 0}
.center{text-align:center}
.spacer{height:6px}
.emptyish{text-align:center;color:var(--sub);padding:28px 10px;font-size:13px}
.emptyish .e{font-size:40px;display:block;margin-bottom:8px}
.badge-rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#f3ece2;font-weight:800;font-size:12px;color:var(--brown)}
.badge-rank.g1{background:#ffe9a8;color:#a7791a}
.kicker{font-size:11px;letter-spacing:1px;font-weight:800;color:var(--sub);text-transform:uppercase}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:6px;border-radius:999px;background:#eee4d6}
.steps i.on{background:var(--sky)}
.opt-card{border:2px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:11px;font-size:14px}
.opt-card .e{font-size:24px}
.opt-card.on{border-color:var(--sky);background:var(--sky-soft)}
/* on-screen keyboard */
.kbwrap{background:#e7edf2;border-radius:16px;padding:8px;margin-top:12px}
.kbrow{display:flex;gap:5px;margin-bottom:5px;justify-content:center}
.kbrow:last-child{margin-bottom:0}
.kbkey{flex:1;min-width:0;border:0;background:#fff;border-radius:9px;padding:12px 0;font-size:18px;font-weight:700;font-family:var(--font);box-shadow:0 2px 0 #c3ccd4;cursor:pointer;color:var(--ink)}
.kbkey:active{transform:translateY(2px);box-shadow:none}
.kbkey.fn{background:#cdd6de;font-size:14px}
.kbkey.fn.wide{flex:2.4}
.kbkey.fn.on{background:#ffd23f}
.kbbox{min-height:54px;background:#fff;border:2px solid var(--line);border-radius:13px;padding:13px 15px;font-size:20px;line-height:1.4;word-break:break-all}
.kbbox .ph{color:var(--sub);font-size:15px}
.caret{display:inline-block;width:2px;height:22px;background:var(--sky);vertical-align:-4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.stepper button{border:0;background:#f3ece2;width:46px;height:48px;font-size:22px;cursor:pointer;color:var(--brown)}
.stepper .val{flex:1;text-align:center;font-weight:800;font-size:19px}
.stepgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:4px}
.stepgrid .lab{font-size:12px;color:var(--sub);text-align:center;margin-bottom:4px;font-weight:700}
.photo-thumb{width:84px;height:84px;border-radius:14px;object-fit:cover;border:2px solid var(--line)}
/* ===== 청미르 하늘 컨셉 ===== */
.sky{background:linear-gradient(170deg,#cdeeff,#eaf7ff 62%,#fffef9)!important;border:0}
.sky .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;z-index:0}
.hero .big,.hero h1,.hero p{position:relative;z-index:2}
.sky .c1{width:66px;height:20px;top:16px;left:-12px;box-shadow:26px 7px 0 -3px #fff}
.sky .c2{width:46px;height:15px;top:46px;right:14px;opacity:.85}
.power{display:flex;flex-direction:column;gap:12px}
.pw{display:flex;align-items:center;gap:11px}
.pw .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;color:#fff}
.pw.r .ic{background:var(--r)}.pw.a .ic{background:var(--a)}.pw.s .ic{background:var(--s)}
.pw .nm{font-weight:800;font-size:14px}
.pw .nm small{font-weight:600;color:var(--sub);font-size:11px;margin-left:5px}
.pw .bar{height:12px;background:#f1ebe2;border-radius:999px;overflow:hidden;margin-top:6px}
.pw .fill{height:100%;border-radius:999px}
.pw.r .fill{background:var(--r)}.pw.a .fill{background:var(--a)}.pw.s .fill{background:var(--s)}
.pw .v{font-family:var(--display);font-size:17px;width:26px;text-align:right}
.journey{position:relative;height:62px;background:linear-gradient(170deg,#d9f0ff,#eef9ff);border-radius:16px;overflow:hidden}
.journey .path{position:absolute;left:12px;right:12px;top:40px;height:6px;background:#fff;border-radius:999px}
.journey .pfill{position:absolute;left:12px;top:40px;height:6px;background:linear-gradient(90deg,#9bd8f7,var(--sky));border-radius:999px}
.journey .mir{position:absolute;top:6px;width:36px;transform:translateX(-50%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.15));transition:left .6s}
.journey .goal{position:absolute;right:8px;top:12px;font-size:22px}
.powerorbs{display:flex;gap:10px}
.orb{flex:1;border-radius:18px;padding:15px 8px;text-align:center;color:#fff;box-shadow:var(--shadow)}
.orb.r{background:linear-gradient(160deg,#3ecf8e,#20a267)}
.orb.a{background:linear-gradient(160deg,#b884ea,#9460d0)}
.orb.s{background:linear-gradient(160deg,#ffb45e,#ee8c34)}
.orb .e{font-size:26px}
.orb .v{font-family:var(--display);font-size:25px;margin-top:2px}
.orb .k{font-size:11px;opacity:.95;font-weight:600}
/* ===== 단계 업 축하 연출 ===== */
.celebrate.stage{background:linear-gradient(175deg,#d6efff,#fffdf6);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-18px;width:9px;height:14px;border-radius:2px;opacity:.92;animation:fall 2.8s linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(760px) rotate(560deg)}}
.pop{position:relative;animation:popin .7s cubic-bezier(.2,1.5,.45,1)}

<script>
/* ============================ 서버 연결 ============================ */
const API='/api';
const CHALLENGE_START='2026-11-02';
function dateOfDay(n){const[y,m,d]=CHALLENGE_START.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()+(n-1));return dt.toISOString().slice(0,10);}
function kstToday(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
const todayN=(()=>{const[y,m,d]=CHALLENGE_START.split('-').map(Number);const s=Date.UTC(y,m-1,d);const[ty,tm,td]=kstToday().split('-').map(Number);const t=Date.UTC(ty,tm-1,td);return Math.max(1,Math.min(28,Math.floor((t-s)/86400000)+1));})();
function getToken(){return localStorage.getItem('mir_token')||'';}
function setToken(t){t?localStorage.setItem('mir_token',t):localStorage.removeItem('mir_token');}
function getAdminTok(){return localStorage.getItem('mir_admin')||'';}
function setAdminTok(t){t?localStorage.setItem('mir_admin',t):localStorage.removeItem('mir_admin');}
async function api(path,opts={}){
  const headers=Object.assign({'content-type':'application/json'},opts.headers||{});
  if(opts.auth)headers['authorization']='Bearer '+getToken();
  if(opts.admin)headers['authorization']='Bearer '+getAdminTok();
  const res=await fetch(API+path,{method:opts.method||'GET',headers,body:opts.body?JSON.stringify(opts.body):undefined});
  let data={};try{data=await res.json();}catch(e){}
  if(!res.ok)throw new Error(data.error||('오류 '+res.status));
  return data;
}
const AREA_EMOJI={r:'📖',a:'🎨',s:'⚽'};
async function loadStats(){const s=await api('/stats');STATS.totalCerts=s.totalCerts;STATS.joinedStudents=s.joined;STATS.rasSplit=s.rasSplit||{r:0,a:0,s:0};STATS.claps=s.claps;STATS.hearts=s.hearts;DB.schoolGoal=s.schoolGoal||1200;if(s.trend)STATS.last14=s.trend.map(t=>({d:t.date.slice(5).replace('-','.'),v:t.count}));}
async function loadMe(){const me=await api('/me',{method:'POST',auth:true});state.who=me.who||'';DB.myPower=me.power||{r:0,a:0,s:0};state.bonus=me.bonus||0;const done=new Set(me.days||[]);DB.myCal=Array.from({length:28},(_,i)=>({n:i+1,done:done.has(dateOfDay(i+1))}));}
async function loadGallery(){const g=await api('/gallery');DB.posts=(g.items||[]).map(it=>({id:it.id,area:it.area,who:it.who,txt:it.note||'오늘의 실천',emoji:AREA_EMOJI[it.area]||'✨',photo:it.photo,claps:it.claps||0,hearts:it.hearts||0,cl:false,he:false}));}
async function syncAll(){await loadStats();if(getToken())await loadMe();await loadGallery();}
async function loadContent(){const c=await api('/content');DB.notices=(c.notices||[]).map(n=>({id:n.id,date:n.date,title:n.title,body:n.body}));if(c.period)DB.period=c.period;return c;}
async function loadAdmin(){let totals={};try{const c=await loadContent();totals=c.gradeTotals||{};}catch(e){}let students=[];try{const a=await api('/admin/students',{admin:true});students=a.students||[];}catch(e){}const joined={};for(const s of students)joined[s.grade]=(joined[s.grade]||0)+1;DB.grades=[1,2,3,4,5,6].map(g=>({g,total:totals[g]||totals[String(g)]||0,joined:joined[g]||0}));DB._students=students;}
function afterNav(view){
  if(state.role==='student'&&!getToken())return;
  if(state.role==='student'){
    if(view==='gallery')loadGallery().then(render).catch(()=>{});
    else if(view==='home'||view==='stats'||view==='record')loadStats().then(()=>getToken()?loadMe():null).then(render).catch(()=>{});
  } else if(state.role==='parent'){
    if(view==='home')loadContent().then(render).catch(()=>{});
    else if(view==='cheer')loadGallery().then(render).catch(()=>{});
  } else if(state.role==='teacher'&&state.teacherAuthed){
    Promise.all([loadStats().catch(()=>{}),loadAdmin().catch(()=>{}),loadGallery().catch(()=>{})]).then(render);
  }
}

const h = (strings,...v)=>strings.map((s,i)=>s+(v[i]??'')).join('');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function go(view){state.view=view;render();afterNav(view);el('root').querySelector('.screen')?.scrollTo(0,0)}
function setRole(r){state.role=r;state.view=(r==='teacher'&&!state.teacherAuthed)?'login':'home';render();afterNav(state.view)}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  el('app').appendChild(t);setTimeout(()=>t.remove(),1800);
}
function overlay(html){el('overlay').innerHTML=html}
function closeOverlay(){el('overlay').innerHTML=''}
function celebrate(title,sub,emoji){
  overlay(h`<div class="celebrate" onclick="closeOverlay()">
    <div><div class="big">${emoji||'🎉'}</div><h3>${title}</h3><p class="muted">${sub||'화면을 누르면 닫혀요'}</p></div></div>`);
  setTimeout(closeOverlay,2200);
}

               (VIEWS[state.role+':home']?VIEWS[state.role+':home']():'<div class="screen"></div>');

}

async function doDeclare(){
  const grade=+el('dg').value, room=+el('dr').value, number=+el('dn').value;
  const name=(el('dname').value||'').trim(), password=(el('dpw').value||'');
  if(!name){toast('이름을 입력해 주세요');return;}
  if(password.length<4){toast('비밀번호는 4자리 이상이에요');return;}
  try{ const r=await api('/declare',{method:'POST',body:{grade,room,number,name,password}}); setToken(r.token); state.who=r.who; }
  catch(e){ toast(e.message||'선언하지 못했어요'); return; }
  try{ await syncAll(); }catch(e){}
  lastStageIdx=mirStage().i;
  state.view='home'; render();

const MIR_STAGES=[
  {min:0,    name:'미르 알',   img:'mir-egg.svg'},
  {min:300,  name:'아기 미르', img:'mir-baby.svg'},
  {min:700,  name:'미르',      img:'mascot.svg'},
  {min:1100, name:'큰 미르',   img:'mir-big.svg'},
];
function mirStage(){
  const cur=STATS.totalCerts; let i=0;
  MIR_STAGES.forEach((s,j)=>{ if(cur>=s.min) i=j; });
  const next=MIR_STAGES[i+1];
  const pct=next?Math.round((cur-MIR_STAGES[i].min)/(next.min-MIR_STAGES[i].min)*100):100;
  return {i,stage:MIR_STAGES[i],next,pct,cur};
}
function growthCard(){
  const g=mirStage();
  const vis = `<img src="${g.stage.img}" alt="${g.stage.name}" style="width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 5px 7px rgba(0,0,0,.12))">`;
  const chk=MIR_STAGES.map((s,idx)=>`<div style="flex:1;text-align:center;opacity:${idx<=g.i?1:.42}">
     <img src="${s.img}" alt="${s.name}" style="width:${idx===g.i?44:30}px;height:${idx===g.i?44:30}px;object-fit:contain">
     <div style="font-size:9.5px;color:var(--sub);font-weight:${idx===g.i?800:500};margin-top:1px">${s.name}</div></div>`).join('<div style="align-self:center;color:#cfe7f5">›</div>');

       <div class="muted center" style="margin-top:7px">청미르 친구들이 함께 <b>${g.cur}</b>번 실천 · <b>${g.next.name}</b>까지 <b>${g.next.min-g.cur}</b>번! (${g.pct}%)</div>`

  return h`<div class="screen">
    <h2 class="sec" style="margin-top:4px">📝 게시글 관리</h2>
    <div class="callout warn">⚠️ 글은 바로 공개돼요. 문제가 있는 글은 "숨김"을 누르면 자랑터·통계에서 즉시 제외됩니다.</div>
    <div class="card">${rows}</div>
  </div>`;
};
async function hidePost(id){

  }catch(e){ toast(e.message||'처리 실패'); }
}

/* ======= 교사: 공지(가정통신문) 관리 ======= */

  try{ await api('/admin/notice',{method:'POST',admin:true,body:{title,body}}); await loadContent(); render(); toast('공지를 올렸어요'); }
  catch(e){ toast(e.message||'저장 실패'); }
}
async function deleteNotice(id){
  try{ await api('/admin/notice/delete',{method:'POST',admin:true,body:{id}}); await loadContent(); render(); toast('공지를 삭제했어요'); }
  catch(e){ toast(e.message||'삭제 실패'); }
}

/* ===== 한글 조합 오토마타 (화면 키보드용) ===== */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const VCOMBO={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ','ㅏㅣ':'ㅐ','ㅑㅣ':'ㅒ','ㅓㅣ':'ㅔ','ㅕㅣ':'ㅖ'};
const VSPLIT={'ㅘ':'ㅗ','ㅙ':'ㅗ','ㅚ':'ㅗ','ㅝ':'ㅜ','ㅞ':'ㅜ','ㅟ':'ㅜ','ㅢ':'ㅡ','ㅐ':'ㅏ','ㅒ':'ㅑ','ㅔ':'ㅓ','ㅖ':'ㅕ'};
const JCOMBO={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const JSPLIT={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
function hgChar(c){
  if(c.cho && c.jung){const ci=CHO.indexOf(c.cho),ji=JUNG.indexOf(c.jung),ki=c.jong?JONG.indexOf(c.jong):0;
    if(ci>=0&&ji>=0&&ki>=0) return String.fromCharCode(0xAC00+(ci*21+ji)*28+ki);}
  return (c.cho||'')+(c.jung||'')+(c.jong||'');
}
function hgFlush(b){ b.t+=hgChar(b.c); b.c={cho:'',jung:'',jong:''}; }
function hgInput(b,ch,isV){
  const c=b.c;
  if(isV){
    if(!c.cho && !c.jung){ c.jung=ch; }
    else if(c.cho && !c.jung){ c.jung=ch; }
    else if(c.jung && !c.jong){ const m=VCOMBO[c.jung+ch]; if(m){c.jung=m;} else {hgFlush(b); b.c={cho:'',jung:ch,jong:''};} }
    else { let remain='',moved=c.jong; if(JSPLIT[c.jong]){remain=JSPLIT[c.jong][0];moved=JSPLIT[c.jong][1];}
      b.t+=hgChar({cho:c.cho,jung:c.jung,jong:remain}); b.c={cho:moved,jung:ch,jong:''}; }
  } else {
    if(!c.cho && !c.jung){ c.cho=ch; }
    else if(c.cho && !c.jung){ b.t+=c.cho; b.c={cho:ch,jung:'',jong:''}; }
    else if(c.cho && c.jung && !c.jong){ if(JONG.indexOf(ch)>0){c.jong=ch;} else {hgFlush(b); b.c={cho:ch,jung:'',jong:''};} }
    else { const m=JCOMBO[c.jong+ch]; if(m){c.jong=m;} else {hgFlush(b); b.c={cho:ch,jung:'',jong:''};} }
  }
}
function hgBack(b){ const c=b.c;
  if(c.jong){ c.jong=JSPLIT[c.jong]?JSPLIT[c.jong][0]:''; }
  else if(c.jung){ c.jung=VSPLIT[c.jung]||''; }
  else if(c.cho){ c.cho=''; }
  else { b.t=b.t.slice(0,-1); }
}
/* 키보드 상태 */
const KB={ name:{t:'',c:{cho:'',jung:'',jong:''}}, msg:{t:'',c:{cho:'',jung:'',jong:''}}, target:'name', shift:false, photo:null };
const SHIFTMAP={'ㄱ':'ㄲ','ㄷ':'ㄸ','ㅂ':'ㅃ','ㅅ':'ㅆ','ㅈ':'ㅉ'};
const KBC=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const KBV=['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ','ㅐ','ㅔ'];
function kbReset(){ KB.name={t:'',c:{cho:'',jung:'',jong:''}}; KB.msg={t:'',c:{cho:'',jung:'',jong:''}}; KB.photo=null; KB.shift=false; }
function kbVal(t){ const b=KB[t]; return b.t+hgChar(b.c); }
function kbTap(ch,isV){ hgInput(KB[KB.target],ch,isV); KB.shift=false; render(); }
function kbBack(){ hgBack(KB[KB.target]); render(); }
function kbSpace(){ const b=KB[KB.target]; hgFlush(b); b.t+=' '; render(); }
function kbShift(){ KB.shift=!KB.shift; render(); }
function kbQuickName(n){ KB.name={t:n,c:{cho:'',jung:'',jong:''}}; render(); }
function kbPhotoPick(ev){ const f=ev.target.files&&ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{KB.photo=r.result;render();}; r.readAsDataURL(f); }
function keyC(c){ const d=KB.shift?(SHIFTMAP[c]||c):c; return `<button class="kbkey" onclick="kbTap('${d}',false)">${d}</button>`; }
function keyV(v){ return `<button class="kbkey" onclick="kbTap('${v}',true)">${v}</button>`; }
function renderKeyboard(){
  return `<div class="kbwrap">
    <div class="kbrow">${KBC.slice(0,7).map(keyC).join('')}</div>
    <div class="kbrow">${KBC.slice(7).map(keyC).join('')}</div>
    <div class="kbrow">${KBV.slice(0,6).map(keyV).join('')}</div>
    <div class="kbrow">${KBV.slice(6).map(keyV).join('')}</div>
    <div class="kbrow">
      <button class="kbkey fn ${KB.shift?'on':''}" onclick="kbShift()">쌍자음</button>
      <button class="kbkey fn wide" onclick="kbSpace()">공백</button>
      <button class="kbkey fn" onclick="kbBack()">⌫ 지움</button>
    </div></div>`;
}
function kbBox(target,ph){ const v=kbVal(target);
  return `<div class="kbbox">${v?esc(v):`<span class="ph">${ph}</span>`}<span class="caret"></span></div>`; }

/* ======= 공용 태블릿 (키오스크) ======= */
const kiosk={step:'idle', name:'', grade:3, room:1, no:1, area:null};
function kstep(n,d){ const v=Math.max(1,Math.min(d==='grade'?6:40,kiosk[d]+n)); kiosk[d]=v; render(); }
function viewKiosk(){
  let inner='';
  if(kiosk.step==='idle'){
    inner=h`<div style="margin:auto;text-align:center;padding:24px 20px">
      <img class="mascot-badge" src="mascot.svg" alt="청미르 마스코트">
      <img src="logo.png" alt="교표" style="width:40px;height:40px;margin-bottom:6px">
      <h1 style="font-family:var(--display);font-size:28px;margin:4px 0 6px">청미르 RAS</h1>
      <p class="muted">교실 공용 태블릿 · 한 명씩 돌아가며 인증해요</p>
      <div style="height:20px"></div>
      <button class="btn p" style="font-size:18px;padding:18px" onclick="kioskStart()">👉 인증 시작하기</button>
    </div>`;
  } else if(kiosk.step==='who'){
    const stepper=(lab,key)=>`<div><div class="lab" style="font-size:14px;color:var(--sub);font-weight:700">${lab}</div><div class="stepper" style="margin-top:5px"><button onclick="kstep(-1,'${key}')">−</button><div class="val">${kiosk[key]}</div><button onclick="kstep(1,'${key}')">+</button></div></div>`;
    inner=h`<div style="margin:auto;padding:22px;width:100%;text-align:center">
      <img class="mascot-badge" src="mascot.svg" alt="청미르" style="width:92px;margin-bottom:2px">
      <h1 style="font-family:var(--display);font-size:24px;margin:0 0 4px">몇 학년 몇 반이에요?</h1>
      <p class="muted" style="margin:0 0 18px">＋ / − 로 내 번호를 맞춰 주세요 🙂</p>
      <div class="stepgrid" style="max-width:350px;margin:0 auto">${stepper('학년','grade')}${stepper('반','room')}${stepper('번호','no')}</div>
      <div style="height:24px"></div>
      <button class="btn p" style="max-width:350px;margin:0 auto" onclick="kioskWhoNext()">다음 →</button>
    </div>`;
  } else if(kiosk.step==='area'){
    inner=h`<div style="margin:auto;padding:22px;width:100%">
      <h1 style="font-family:var(--display);font-size:23px;margin:0 0 4px;text-align:center">반가워요! 🌈</h1>
      <p class="muted" style="margin:0 0 16px;text-align:center">${esc(kiosk.name||'')} · 오늘 어떤 활동을 했나요?</p>
      <div class="seg3" style="gap:10px">
        <div class="opt r" onclick="kioskArea('r')" style="padding:24px 6px"><span class="e" style="font-size:38px">📖</span>독서</div>
        <div class="opt a" onclick="kioskArea('a')" style="padding:24px 6px"><span class="e" style="font-size:38px">🎨</span>예술</div>
        <div class="opt s" onclick="kioskArea('s')" style="padding:24px 6px"><span class="e" style="font-size:38px">⚽</span>스포츠</div>
      </div>
    </div>`;
  } else if(kiosk.step==='write'){
    const an={r:['독서','📖','r'],a:['예술','🎨','a'],s:['스포츠','⚽','s']}[kiosk.area];
    inner=h`<div style="padding:16px 16px 22px">
      <div style="text-align:center;margin-bottom:8px"><span class="tag ${an[2]}" style="font-size:13px;padding:4px 12px">${an[1]} ${an[0]} 인증</span></div>
      <label style="font-size:13px;font-weight:700">오늘의 한마디</label>
      ${kbBox('msg','예: 책을 읽고 재미있었어요')}
      <div style="height:9px"></div>
      ${renderKeyboard()}
      <div style="height:12px"></div>
      <button class="btn p" onclick="kioskSubmit()">✅ 인증 완료</button>
    </div>`;
  } else if(kiosk.step==='done'){
    inner=h`<div style="margin:auto;text-align:center;padding:34px 24px">
      <div style="font-size:72px" class="big">✅</div>
      <h1 style="font-family:var(--display);font-size:25px;margin:8px 0 6px">인증 완료!</h1>
      <p class="muted" style="margin:0 0 10px">${esc(kiosk.name||'')} 친구, 잘했어요!</p>
      ${kbVal('msg').trim()?`<p style="font-size:14px;margin:0 0 12px">"${esc(kbVal('msg').trim())}"</p>`:''}
      <p class="muted">다음 친구에게 넘겨주세요 🙌</p>
      <div style="height:16px"></div>
      <button class="btn p" onclick="kioskStart()">다음 친구 시작하기</button>
    </div>`;
  }
  return h`<div style="height:100vh;display:flex;flex-direction:column">
    <div class="topbar" style="background:#2d2620">
      <div class="brand" style="color:#fff"><span class="mark" style="background:#ffd23f;color:#3a2e1c">📟</span><span style="color:#fff">공용 태블릿<small style="color:#bbb">교실 인증기</small></span></div>
      <button class="phoneoff" style="border:0;cursor:pointer;margin-left:auto" onclick="setRole('teacher')">✕ 종료</button>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow-y:auto">${inner}</div>
  </div>`;
}
function kioskStart(){ kbReset(); KB.target='name'; kiosk.step='who'; kiosk.name=''; kiosk.area=null; render(); }
function kioskWhoNext(){
  kiosk.name = `${kiosk.grade}학년 ${kiosk.room}반 ${kiosk.no}번`;
  KB.target='msg'; kiosk.step='area'; render();
}
function kioskArea(a){ kiosk.area=a; kiosk.step='write'; KB.target='msg'; render(); }
async function kioskSubmit(){
  const a=kiosk.area, note=kbVal('msg').trim();
  kiosk.step='done'; render();
  try{
    const idr=await api('/kiosk-id',{method:'POST',body:{grade:+kiosk.grade,room:+kiosk.room,number:+kiosk.no}});
    await fetch(API+'/certify',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+idr.token},body:JSON.stringify({area:a,note,source:'kiosk'})});
    await loadStats(); const up=stageWentUp(); if(up>=0) celebrateStage(up); render();
  }catch(e){ /* 공용 태블릿: 저장 실패해도 완료 화면은 유지 */ }
  setTimeout(()=>{ if(kiosk.step==='done'){ kiosk.step='idle'; render(); } },6000);
}
/* ==APPEND== */
boot();
async function boot(){
  state.teacherAuthed = !!getAdminTok();
  try{
    if(getToken()) await syncAll();
    else await loadStats();
  }catch(e){}
  lastStageIdx=mirStage().i;
  render();
}
</script>
