 <linearGradient id="b" x1="0.3" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#6fd0f8"/><stop offset="1" stop-color="#2fa3e8"/></linearGradient>
 <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3ecff"/><stop offset="1" stop-color="#8fd3f7"/></linearGradient>
